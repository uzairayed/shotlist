<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Two Buttons</title>
  </head>
  <body>
    <button id="cta" type="button">Get started</button>
    <div id="panel-a">
      <button type="button">Alpha</button>
    </div>
    <div id="panel-b">
      <button type="button">Beta</button>
    </div>
    <script>
      document.querySelector("#panel-a button").addEventListener("click", function () {
        this.setAttribute("data-hit", "alpha");
      });
      document.querySelector("#panel-b button").addEventListener("click", function () {
        this.setAttribute("data-hit", "beta");
      });
    </script>
  </body>
</html>
